name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK (Debug-Signed for Direct Install)
        working-directory: ./android
        run: gradle assembleRelease

      - name: Copy APK to root and public
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CelebrateMe.apk
          cp android/app/build/outputs/apk/release/app-release.apk public/CelebrateMe.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CelebrateMe-APK
          path: CelebrateMe.apk

      - name: Create/Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-apk
          name: "CelebrateMe Android APK (6:00 AM Daily Notification)"
          body: "Installable Android APK for CelebrateMe with exact 6:00 AM daily notifications (including 'NO BIRTHDAY TODAY' when no birthdays are scheduled)."
          files: CelebrateMe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

