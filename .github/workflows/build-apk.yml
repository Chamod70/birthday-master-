name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile and Sign Android APK Directly with Android SDK
        run: |
          set -e
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM/android.jar"
          echo "Using BUILD_TOOLS=$BUILD_TOOLS"
          echo "Using ANDROID_JAR=$ANDROID_JAR"

          rm -rf /tmp/apk_build
          mkdir -p /tmp/apk_build/compiled_res /tmp/apk_build/gen /tmp/apk_build/classes /tmp/apk_build/apk

          "$BUILD_TOOLS/aapt2" compile --dir android/app/src/main/res -o /tmp/apk_build/compiled_res/res.zip
          "$BUILD_TOOLS/aapt2" link \
            -I "$ANDROID_JAR" \
            --manifest android/app/src/main/AndroidManifest.xml \
            --java /tmp/apk_build/gen \
            -o /tmp/apk_build/apk/unaligned.apk \
            /tmp/apk_build/compiled_res/res.zip

          javac --release 11 -classpath "$ANDROID_JAR" \
            -d /tmp/apk_build/classes \
            /tmp/apk_build/gen/com/celebrateme/birthdaymaster/R.java \
            android/app/src/main/java/com/celebrateme/birthdaymaster/*.java

          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 24 \
            --output /tmp/apk_build/apk \
            /tmp/apk_build/classes/com/celebrateme/birthdaymaster/*.class

          (cd /tmp/apk_build/apk && zip -q -u unaligned.apk classes.dex)

          "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/apk_build/apk/unaligned.apk /tmp/apk_build/apk/aligned.apk

          keytool -genkeypair -v \
            -keystore /tmp/apk_build/release.keystore \
            -storepass celebrateme123 \
            -alias celebrateme \
            -keypass celebrateme123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CelebrateMe,O=BirthdayMaster,C=LK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/apk_build/release.keystore \
            --ks-pass pass:celebrateme123 \
            --key-pass pass:celebrateme123 \
            --out CelebrateMe.apk \
            /tmp/apk_build/apk/aligned.apk

          cp CelebrateMe.apk public/CelebrateMe.apk
          ls -lh CelebrateMe.apk

      - name: Create/Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-apk
          name: "CelebrateMe Android APK (6:00 AM Daily Notification)"
          body: "Installable Android APK for CelebrateMe with exact 6:00 AM daily notifications (including 'NO BIRTHDAY TODAY' when no birthdays are scheduled)."
          files: CelebrateMe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
