name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.5 and Build APK
        working-directory: ./android
        run: |
          curl -fL https://github.com/gradle/gradle-distributions/releases/download/v8.5.0/gradle-8.5-bin.zip -o /tmp/gradle.zip || curl -fL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Copy APK to root and public
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CelebrateMe.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk public/CelebrateMe.apk

      - name: Create/Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-apk
          name: "CelebrateMe Android APK (6:00 AM Daily Notification)"
          body: "Installable Android APK for CelebrateMe with exact 6:00 AM daily notifications (including 'NO BIRTHDAY TODAY' when no birthdays are scheduled)."
          files: CelebrateMe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
